<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Évaluation complète — Lycée Maritime Boulogne</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --marine:#1e3a5f;--marine-fonce:#152a45;--ocean:#2c5a8c;
    --azur:#4a90c4;--azur-clair:#7fb3d9;--anis:#a4c639;
    --ecume:#f0f5fa;--ecume-2:#e3edf5;
    --card:#ffffff;--text:#1a2a3a;--muted:#7a8fa6;--border:#d8e3ed;
    --radius:10px;
    --shadow:0 1px 2px rgba(30,58,95,.06), 0 6px 16px rgba(30,58,95,.08);
    --shadow-hover:0 6px 12px rgba(30,58,95,.10), 0 16px 32px rgba(30,58,95,.12);
    --success:#5fa02c;--warning:#e8a63c;--danger:#c93e3e;
  }
  *{box-sizing:border-box}
  html, body {
    margin:0; padding:0;
    background: linear-gradient(180deg, #e8f1f9 0%, #f0f5fa 400px, #f5f9fc 100%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    width:100%; max-width:100%; overflow-x:hidden;
    min-height:100vh;
  }
  .wrap{width:100%;max-width:1600px;margin:0 auto;padding:12px;overflow-x:hidden}

  .header{
    background: linear-gradient(135deg, var(--marine) 0%, var(--ocean) 100%);
    border:1px solid var(--marine-fonce);
    border-radius:var(--radius);
    box-shadow:0 8px 24px rgba(30,58,95,.20);
    padding:14px 16px;margin-bottom:14px;text-align:center;
  }
  .header .banner{display:block;margin:0 auto 6px;max-width:260px;width:100%;height:auto}
  .header h1{margin:0;font-size:16px;font-weight:700;line-height:1.3;color:#fff}
  .header .subtitle{margin:4px 0 0;font-size:13px;color:#b8d2e8;font-weight:500}
  .header .updated{
    margin-top:8px;font-size:11.5px;color:#d0e0ee;
    display:inline-flex;align-items:center;gap:6px;
    padding:3px 10px;background:rgba(255,255,255,.12);
    border-radius:14px;
  }
  .header .updated .dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--anis);box-shadow:0 0 0 3px rgba(164,198,57,.30);
  }

  .loading{
    text-align:center;padding:50px 16px;color:var(--muted);font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:12px;
  }
  .loading .spin{
    width:22px;height:22px;border:2px solid var(--border);
    border-top-color:var(--azur);border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .table-wrap{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{
    position:sticky;top:0;background:var(--marine);color:#fff;
    text-align:left;padding:11px 10px;font-weight:600;
    white-space:nowrap;cursor:pointer;user-select:none;
  }
  thead th:hover{background:var(--ocean)}
  thead th:not(:first-child){text-align:right}
  thead th .arrow{display:inline-block;margin-left:5px;opacity:.4;font-size:10px}
  thead th.sorted .arrow{opacity:1}
  tbody td{
    padding:10px;border-top:1px solid var(--border);
    vertical-align:top;word-break:break-word;
  }
  tbody td:first-child{font-weight:600}
  tbody td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
  tbody td.taux{font-weight:700;font-size:14px}
  tbody td.taux.high{color:var(--success)}
  tbody td.taux.mid{color:var(--warning)}
  tbody td.taux.low{color:var(--danger)}
  tbody td.empty{color:var(--muted);font-weight:400}
  tbody tr:nth-child(even){background:#fafbfd}
  tbody tr:hover{background:#eef4ff}

  .formation-link{
    color:var(--marine);text-decoration:none;
    display:inline-flex;align-items:center;gap:6px;
    font-weight:600;
    border-bottom:1px dashed transparent;
    transition:color .15s, border-color .15s;
  }
  .formation-link:hover{color:var(--azur);border-bottom-color:var(--azur)}
  .formation-link .ext{font-size:11px;opacity:.5;transition:opacity .15s}
  .formation-link:hover .ext{opacity:1}

  .empty-msg{text-align:center;padding:50px;color:var(--muted);font-size:14px}

  footer.foot{
    text-align:center;padding:16px 16px 12px;font-size:12px;
    color:var(--muted);line-height:1.4;
  }
  footer.foot p{margin:0}
  footer.foot p + p{margin-top:3px}
  footer.foot .brand{color:var(--marine);font-weight:600;letter-spacing:.3px}
  footer.foot .sep{display:inline-block;margin:0 5px;color:var(--azur-clair)}
  footer.foot .mention{font-style:italic;font-size:11px;color:var(--muted);opacity:.85}

  @media (min-width:900px){
    .wrap{padding:20px}
    .header{padding:16px 24px;margin-bottom:16px}
    .header .banner{max-width:260px}
    .header h1{font-size:20px}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="header">
    <img class="banner"
      src="https://www.lyceemaritime-boulogne.com/application/themes/theme_simpleo_coteo/images/logo-lycee-maritime-boulogne.jpg"
      alt="Lycée Maritime Boulogne">
    <h1>Évaluation complète des formations</h1>
    <p class="subtitle">Lycée Professionnel Maritime Boulogne - Le Portel</p>
    <div class="updated" id="updated" style="display:none">
      <span class="dot"></span>
      <span>Données mises à jour le <span id="updated-date">…</span></span>
    </div>
  </header>

  <div class="loading" id="loading">
    <div class="spin"></div>
    <div>Chargement des données…</div>
  </div>

  <div class="table-wrap" id="tableWrap" style="display:none">
    <table id="table"></table>
  </div>

  <div class="empty-msg" id="empty" style="display:none">Aucune donnée disponible</div>

  <footer class="foot">
    <p>
      Conception et réalisation : <span class="brand">ZEG</span>
      <span class="sep">—</span>
      Lycée Maritime Boulogne, <span id="year">2026</span>
    </p>
    <p class="mention">Projet réalisé dans le cadre du pacte enseignant</p>
  </footer>
</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const BASE = "https://smqlpmboulogne.github.io/satisfactionfc/";
  const CSV_RESULTATS = BASE + "formations.csv";
  const CSV_REFUS = BASE + "refus.csv";
  const DATE_FILE = BASE + "last-update.txt";

  let DATA = { rows: [] };
  let sortKey = 'name';
  let sortAsc = true;

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function parseCSV(text){
    const rows = [];
    let cur = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ','){ cur.push(field); field = ''; }
        else if (c === '\n'){ cur.push(field); rows.push(cur); cur = []; field = ''; }
        else if (c === '\r'){ }
        else field += c;
      }
    }
    if (field !== '' || cur.length){ cur.push(field); rows.push(cur); }
    return rows.filter(r => r.some(c => c.trim() !== ''));
  }

  function toPercent(v){
    if (!v) return null;
    const s = String(v).trim().replace('%','').replace(',','.');
    const n = parseFloat(s);
    if (isNaN(n)) return null;
    return n <= 1 ? n * 100 : n;
  }

  function level(n){
    if (n == null) return 'unknown';
    if (n >= 75) return 'high';
    if (n >= 50) return 'mid';
    return 'low';
  }

  function fmtPct(v){
    if (v == null) return '—';
    return v.toFixed(1).replace('.',',') + ' %';
  }

  async function chargerTout(){
    try {
      const [resFormations, resRefus] = await Promise.all([
        fetch(CSV_RESULTATS + '?t=' + Date.now(), { cache: 'no-store' }),
        fetch(CSV_REFUS + '?t=' + Date.now(), { cache: 'no-store' })
      ]);

      const rowsF = parseCSV(await resFormations.text());
      const rowsR = parseCSV(await resRefus.text());

      // --- Dictionnaire REFUS par formation ---
      const refusMap = {};
      rowsR.slice(1).forEach(r => {
        const f = (r[0] || '').trim();
        if (!f) return;
        refusMap[f] = {
          refus: parseInt(r[1], 10) || 0,
          reponses: parseInt(r[2], 10) || 0,
          taux: toPercent(r[3])
        };
      });

      // --- Construire DATA depuis formations.csv ---
      if (rowsF.length >= 2){
        const allHeaders = rowsF[0].map(h => h.trim());

        let cutoff = allHeaders.length;
        for (let i = 1; i < allHeaders.length; i++){
          if (allHeaders[i] === ''){ cutoff = i; break; }
        }
        const headers = allHeaders.slice(0, cutoff);

        const iReponses = headers.findIndex(h => /^Réponses?$/i.test(h));
        const iRep = headers.findIndex(h => /réponse aux attentes/i.test(h));
        const iObj = headers.findIndex(h => /atteinte des objectifs/i.test(h));
        const iUti = headers.findIndex(h => /utilisation compétences/i.test(h));
        const iQua = headers.findIndex(h => /qualité.*animation/i.test(h));

        DATA.rows = rowsF.slice(1)
          .filter(r => r[0] && r[0].trim() !== '')
          .map(r => {
            const name = r[0].trim();
            const getNum = (i) => {
              if (i < 0) return null;
              const raw = (r[i] || '').trim();
              if (raw === '' || raw === '—') return null;
              return toPercent(raw);
            };
            const reponses = iReponses >= 0 ? (parseInt(r[iReponses], 10) || null) : null;
            const pRep = getNum(iRep);
            const pObj = getNum(iObj);
            const pUti = getNum(iUti);
            const pQua = getNum(iQua);

            const vals = [pRep, pObj, pUti, pQua].filter(v => v != null);
            const satisfaction = vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : null;

            const refusInfo = refusMap[name] || { refus: null, taux: null };

            return {
              name, satisfaction, reponses,
              pRep, pObj, pUti, pQua,
              refus: refusInfo.refus,
              tauxRefus: refusInfo.taux
            };
          });
      }

      render();
      chargerDate();

    } catch (e) {
      console.error("Erreur chargement:", e);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('empty').textContent = "Impossible de charger : " + e.message;
      document.getElementById('empty').style.display = 'block';
    }
  }

  function getValue(row, key){
    if (key === 'name') return row.name.toLowerCase();
    return row[key] != null ? row[key] : null;
  }
  function sortRows(rows){
    return rows.slice().sort((a, b) => {
      const va = getValue(a, sortKey), vb = getValue(b, sortKey);
      if (va === null && vb === null) return 0;
      if (va === null) return 1;
      if (vb === null) return -1;
      if (typeof va === 'number' && typeof vb === 'number'){
        return sortAsc ? va - vb : vb - va;
      }
      const sa = String(va), sb = String(vb);
      return sortAsc ? sa.localeCompare(sb,'fr') : sb.localeCompare(sa,'fr');
    });
  }

  function renderTable(rows){
    const columns = [
      { key:'name',         label:'Formation' },
      { key:'satisfaction', label:'Taux de satisfaction' },
      { key:'pRep',         label:'Réponse aux attentes' },
      { key:'pObj',         label:'Atteinte des objectifs' },
      { key:'pUti',         label:'Utilisation compétences' },
      { key:'pQua',         label:'Qualité animation' },
      { key:'reponses',     label:'Réponses' },
      { key:'refus',        label:'Refus' },
      { key:'tauxRefus',    label:'Taux de refus' }
    ];

    const thead = '<thead><tr>' + columns.map(c => {
      const isSorted = sortKey === c.key;
      const cls = isSorted ? 'sorted' : '';
      const arr = isSorted ? (sortAsc ? '▲' : '▼') : '▲';
      return '<th data-key="'+c.key+'" class="'+cls+'">'+esc(c.label)+
             '<span class="arrow">'+arr+'</span></th>';
    }).join('') + '</tr></thead>';

    const tbody = '<tbody>' + rows.map(r => {
      const lvl = level(r.satisfaction);
      const urlDetail = 'detail.html?formation=' + encodeURIComponent(r.name);
      return '<tr>' +
        '<td>' +
          '<a class="formation-link" href="'+urlDetail+'" target="_blank" rel="noopener">' +
            esc(r.name) + '<span class="ext">↗</span>' +
          '</a>' +
        '</td>' +
        '<td class="taux '+lvl+'">'+fmtPct(r.satisfaction)+'</td>' +
        '<td class="'+(r.pRep == null ? 'empty' : '')+'">'+fmtPct(r.pRep)+'</td>' +
        '<td class="'+(r.pObj == null ? 'empty' : '')+'">'+fmtPct(r.pObj)+'</td>' +
        '<td class="'+(r.pUti == null ? 'empty' : '')+'">'+fmtPct(r.pUti)+'</td>' +
        '<td class="'+(r.pQua == null ? 'empty' : '')+'">'+fmtPct(r.pQua)+'</td>' +
        '<td class="'+(r.reponses == null ? 'empty' : '')+'">'+(r.reponses != null ? r.reponses : '—')+'</td>' +
        '<td class="'+(r.refus == null ? 'empty' : '')+'">'+(r.refus != null ? r.refus : '—')+'</td>' +
        '<td class="'+(r.tauxRefus == null ? 'empty' : '')+'">'+fmtPct(r.tauxRefus)+'</td>' +
        '</tr>';
    }).join('') + '</tbody>';

    const $table = document.getElementById('table');
    $table.innerHTML = thead + tbody;

    $table.querySelectorAll('thead th').forEach(th => {
      th.addEventListener('click', () => {
        const k = th.dataset.key;
        if (!k) return;
        if (k === sortKey) sortAsc = !sortAsc;
        else { sortKey = k; sortAsc = true; }
        render();
      });
    });
  }

  function render(){
    if (!DATA.rows.length){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('empty').style.display = 'block';
      return;
    }
    const rows = sortRows(DATA.rows);
    renderTable(rows);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('tableWrap').style.display = 'block';
    document.getElementById('empty').style.display = 'none';
  }

  async function chargerDate(){
    try {
      const r = await fetch(DATE_FILE + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const txt = (await r.text()).trim();
      const d = new Date(txt);
      if (isNaN(d)) return;
      const opts = { day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' };
      document.getElementById('updated-date').textContent = d.toLocaleString('fr-FR', opts);
      document.getElementById('updated').style.display = 'inline-flex';
    } catch(e){}
  }

  chargerTout();
</script>
</body>
</html>
