<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Détail de la formation — Lycée Maritime Boulogne</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{
    --marine:#1e3a5f;--marine-fonce:#152a45;--ocean:#2c5a8c;
    --azur:#4a90c4;--azur-clair:#7fb3d9;--anis:#a4c639;
    --ecume:#f0f5fa;--ecume-2:#e3edf5;
    --card:#ffffff;--text:#1a2a3a;--muted:#7a8fa6;--border:#d8e3ed;
    --radius:10px;
    --shadow:0 1px 2px rgba(30,58,95,.06), 0 6px 16px rgba(30,58,95,.08);
    --success:#5fa02c;--success-2:#4a8a1f;
    --warning:#e8a63c;--warning-2:#c88a1c;
    --danger:#c93e3e;--danger-2:#a52f2f;
  }
  *{box-sizing:border-box}
  html, body {
    margin:0; padding:0;
    background: linear-gradient(180deg, #e8f1f9 0%, #f0f5fa 400px, #f5f9fc 100%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    width:100%; max-width:100%; overflow-x:hidden;
    min-height:100vh;
  }
  .wrap{width:100%;max-width:900px;margin:0 auto;padding:12px;overflow-x:hidden}

  .header{
    background: linear-gradient(135deg, var(--marine) 0%, var(--ocean) 100%);
    border:1px solid var(--marine-fonce);
    border-radius:var(--radius);
    box-shadow:0 8px 24px rgba(30,58,95,.20);
    padding:14px 16px;margin-bottom:14px;text-align:center;
  }
  .header .banner{display:block;margin:0 auto 6px;max-width:220px;width:100%;height:auto}
  .header h1{margin:0;font-size:15px;font-weight:700;line-height:1.3;color:#fff}
  .header .subtitle{margin:4px 0 0;font-size:12.5px;color:#b8d2e8;font-weight:500}

  .top-bar{
    display:flex;justify-content:space-between;align-items:center;
    gap:10px;margin-bottom:14px;flex-wrap:wrap;
  }
  .back-link{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 14px;
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    color:var(--marine);text-decoration:none;font-size:13px;font-weight:600;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .back-link:hover{
    transform:translateX(-3px);
    box-shadow:0 6px 12px rgba(30,58,95,.10);
    border-color:var(--azur-clair);
  }
  .back-link .arrow{color:var(--azur);font-weight:700}

  .btn-print{
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 16px;
    background:var(--marine);color:#fff;
    border:none;border-radius:var(--radius);
    box-shadow:0 2px 8px rgba(30,58,95,.20);
    font-size:13px;font-weight:600;font-family:inherit;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .btn-print:hover{
    background:var(--ocean);
    transform:translateY(-2px);
    box-shadow:0 6px 14px rgba(30,58,95,.25);
  }
  .btn-print svg{width:16px;height:16px;fill:currentColor}

  .loading{
    text-align:center;padding:50px 16px;color:var(--muted);font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:12px;
  }
  .loading .spin{
    width:22px;height:22px;border:2px solid var(--border);
    border-top-color:var(--azur);border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .page{display:flex;flex-direction:column;gap:16px}

  /* Bloc titre */
  .titre-bloc{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:20px 22px;
    border-left:5px solid var(--azur);
  }
  .titre-bloc.high{border-left-color:var(--success)}
  .titre-bloc.mid{border-left-color:var(--warning)}
  .titre-bloc.low{border-left-color:var(--danger)}
  .titre-bloc .eyebrow{
    font-size:11.5px;color:var(--muted);font-weight:600;
    text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;
  }
  .titre-bloc h1{
    margin:0;font-size:24px;font-weight:700;color:var(--marine);
    line-height:1.25;word-break:break-word;
  }

  /* Bloc taux */
  .taux-bloc{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:24px 22px;
    text-align:center;
  }
  .taux-bloc .label{
    font-size:12.5px;color:var(--muted);font-weight:500;
    text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;
  }
  .taux-bloc .value{
    font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;
    letter-spacing:-2px;line-height:1;color:var(--azur);
    margin-bottom:14px;
  }
  .taux-bloc.high .value{color:var(--success)}
  .taux-bloc.mid .value{color:var(--warning)}
  .taux-bloc.low .value{color:var(--danger)}
  .taux-bloc .bar{
    width:100%;max-width:400px;height:10px;margin:0 auto;
    background:var(--ecume-2);border-radius:5px;overflow:hidden;
  }
  .taux-bloc .bar span{
    display:block;height:100%;border-radius:5px;
    background:linear-gradient(90deg, var(--azur), var(--ocean));
    transition:width .6s ease;
  }
  .taux-bloc.high .bar span{background:linear-gradient(90deg, var(--anis), var(--success-2))}
  .taux-bloc.mid .bar span{background:linear-gradient(90deg, #f0c060, var(--warning-2))}
  .taux-bloc.low .bar span{background:linear-gradient(90deg, #e06060, var(--danger-2))}
  .taux-bloc .meta{
    margin-top:14px;font-size:13px;color:var(--muted);
  }
  .taux-bloc .meta strong{color:var(--marine)}

  /* Indicateurs */
  .indicators-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:12px;
  }
  .ind-card{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 14px;text-align:center;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .ind-card:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 12px rgba(30,58,95,.10);
  }
  .ind-card .ind-label{
    font-size:12px;color:var(--muted);font-weight:500;
    margin-bottom:8px;line-height:1.35;min-height:32px;
    display:flex;align-items:center;justify-content:center;
  }
  .ind-card .ind-value{
    font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;
    color:var(--azur);letter-spacing:-0.5px;
  }
  .ind-card .ind-value.empty{color:var(--muted);font-weight:500}
  .ind-card.high .ind-value{color:var(--success)}
  .ind-card.mid .ind-value{color:var(--warning)}
  .ind-card.low .ind-value{color:var(--danger)}

  /* ============================================================
     BLOC SUGGESTIONS & REMARQUES
     Contient : bouton télécharger + Synthèse IA
     ============================================================ */
  .sugg-bloc{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:20px 22px;
    border-left:5px solid var(--azur);
  }
  .sugg-bloc .sugg-header{
    display:flex;justify-content:space-between;align-items:center;
    gap:12px;flex-wrap:wrap;
    margin-bottom:16px;
    padding-bottom:14px;border-bottom:1px solid var(--border);
  }
  .sugg-bloc .sugg-title{
    font-size:17px;font-weight:700;color:var(--marine);
    margin:0;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .sugg-bloc .sugg-title .count{
    background:var(--ecume);color:var(--muted);
    font-size:12px;font-weight:600;
    padding:3px 10px;border-radius:12px;
  }
  .btn-download{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 16px;
    background:#fff;color:var(--marine);
    border:1px solid var(--azur-clair);
    border-radius:var(--radius);
    font-size:13px;font-weight:600;font-family:inherit;
    cursor:pointer;
    transition:background .15s ease, transform .15s ease, border-color .15s ease;
    text-decoration:none;
    line-height:1.3;
  }
  .btn-download:hover{
    background:var(--ecume);
    border-color:var(--azur);
    transform:translateY(-2px);
  }
  .btn-download:active{transform:translateY(0)}
  .btn-download svg{width:15px;height:15px;fill:currentColor;flex:0 0 auto}

  /* Sous-section Synthèse IA */
  .sub-section{
    margin-top:0;
    padding:16px 18px;
    background: linear-gradient(135deg, #ffffff, var(--ecume));
    border-radius:8px;
    border-left:3px solid var(--anis);
  }
  .sub-section .sub-title{
    margin:0 0 12px;
    font-size:15px;font-weight:700;color:var(--marine);
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .sub-section .sub-title .badge{
    background:var(--ecume-2);color:var(--muted);
    font-size:11.5px;font-weight:600;
    padding:3px 10px;border-radius:12px;
  }
  .sub-section .sub-hint{
    font-size:12.5px;color:var(--muted);
    margin:0 0 10px;font-style:italic;
  }

  /* Contenu synthèse (Markdown) */
  .synth-content{
    font-size:14.5px;color:#475467;line-height:1.65;
  }
  .synth-content h1,
  .synth-content h2,
  .synth-content h3{
    color:var(--marine);font-weight:700;
    margin:14px 0 8px 0;padding-bottom:4px;
    border-bottom:1px dashed var(--border);
  }
  .synth-content h1{font-size:17px}
  .synth-content h2{font-size:15px}
  .synth-content h3{font-size:14px}
  .synth-content h1:first-child,
  .synth-content h2:first-child,
  .synth-content h3:first-child{margin-top:0}
  .synth-content p{margin:0 0 12px 0}
  .synth-content p:last-child{margin-bottom:0}
  .synth-content strong{color:var(--marine);font-weight:700}
  .synth-content em{font-style:italic}
  .synth-content ul,
  .synth-content ol{margin:0 0 12px 20px;padding:0}
  .synth-content li{margin-bottom:6px}
  .synth-content hr{
    border:none;border-top:1px dashed var(--border);margin:14px 0;
  }
  .synth-none{
    color:var(--muted);font-style:italic;font-size:14px;
    text-align:center;padding:16px;
  }

  .error-box{
    text-align:center;padding:40px 20px;
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    color:var(--muted);
  }
  .error-box h3{color:var(--marine);margin:0 0 8px;font-size:18px}
  .error-box p{margin:0;font-size:14px}

  footer.foot{
    text-align:center;padding:24px 16px 12px;font-size:12px;
    color:var(--muted);line-height:1.4;
  }
  footer.foot p{margin:0}
  footer.foot p + p{margin-top:3px}
  footer.foot .brand{color:var(--marine);font-weight:600;letter-spacing:.3px}
  footer.foot .sep{display:inline-block;margin:0 5px;color:var(--azur-clair)}
  footer.foot .mention{font-style:italic;font-size:11px;color:var(--muted);opacity:.85}

  /* Tablette / Desktop */
  @media (min-width:600px){
    .wrap{padding:20px}
    .header{padding:18px 24px}
    .header .banner{max-width:260px}
    .header h1{font-size:17px}
    .titre-bloc h1{font-size:28px}
    .taux-bloc .value{font-size:72px}
    .sugg-bloc{padding:26px 30px}
    .sub-section{padding:18px 22px}
  }

  /* Mobile */
  @media (max-width:600px){
    .top-bar{flex-direction:column;align-items:stretch}
    .back-link, .btn-print{width:100%;justify-content:center}
    .sugg-bloc .sugg-header{flex-direction:column;align-items:stretch}
    .btn-download{width:100%;justify-content:center;text-align:center}
    .sugg-bloc .sugg-title{font-size:16px}
    .sub-section{padding:14px 14px}
    .synth-content{font-size:14px}
    .titre-bloc h1{font-size:20px}
    .taux-bloc .value{font-size:52px}
  }

  /* Impression */
  @media print {
    @page { size: A4; margin: 15mm 12mm; }
    html, body { background: #fff !important; color: #000; font-size: 11pt; }
    .wrap{ max-width: 100%; padding: 0; margin: 0; }
    .back-link, .btn-print, .btn-download, footer.foot .mention{ display: none !important; }
    .header{
      background: none !important; border: none; box-shadow: none;
      padding: 0 0 10px 0; margin-bottom: 12px;
      border-bottom: 2px solid var(--marine); text-align: left;
    }
    .header .banner{ max-width: 180px; margin: 0 0 6px 0; }
    .header h1{color: var(--marine); font-size: 14pt}
    .header .subtitle{color: var(--marine); font-size: 10pt}
    .titre-bloc, .taux-bloc, .ind-card, .sugg-bloc, .sub-section{
      border: 1px solid #ccc; box-shadow: none; page-break-inside: avoid;
    }
    .titre-bloc h1{font-size: 18pt}
    .taux-bloc .value{font-size: 40pt}
    .indicators-grid{ grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .ind-card .ind-value{font-size: 18pt}
    .sub-section{ background: #f5f5f5; padding: 10px 12px; }
    .synth-content strong, .synth-content h1,
    .synth-content h2, .synth-content h3{ color: #000; }
    .page > *{ page-break-inside: avoid }
    footer.foot{ margin-top: 16px; padding-top: 8px; border-top: 1px solid #ccc; font-size: 9pt; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="header">
    <img class="banner"
      src="https://www.lyceemaritime-boulogne.com/application/themes/theme_simpleo_coteo/images/logo-lycee-maritime-boulogne.jpg"
      alt="Lycée Maritime Boulogne">
    <h1>Détail de la formation</h1>
    <p class="subtitle">Lycée Professionnel Maritime Boulogne - Le Portel</p>
  </header>

  <div class="top-bar">
    <a class="back-link" href="index.html">
      <span class="arrow">←</span>
      Retour au tableau de bord
    </a>
    <button class="btn-print" onclick="window.print()" type="button">
      <svg viewBox="0 0 24 24">
        <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
      </svg>
      Imprimer / PDF
    </button>
  </div>

  <div class="loading" id="loading">
    <div class="spin"></div>
    <div>Chargement des données…</div>
  </div>

  <div id="content" style="display:none"></div>

  <footer class="foot">
    <p>
      Conception et réalisation : <span class="brand">ZEG</span>
      <span class="sep">—</span>
      Lycée Maritime Boulogne, <span id="year">2026</span>
    </p>
    <p class="mention">Projet réalisé dans le cadre du pacte enseignant</p>
  </footer>
</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const BASE = "https://smqlpmboulogne.github.io/satisfactionfc/";
  const CSV_RESULTATS = BASE + "formations.csv";
  const CSV_SUGGESTIONS = BASE + "suggestions.csv";
  const CSV_REFUS = BASE + "refus.csv";
  const CSV_SYNTHESE = BASE + "synthese.csv";

  let SUGGESTIONS = {};   // { "Nom formation": [{ date, texte }, ...] }
  let SYNTHESES = {};
  let DONNEES_FORMATION = null;

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function parseCSV(text){
    const rows = [];
    let cur = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ','){ cur.push(field); field = ''; }
        else if (c === '\n'){ cur.push(field); rows.push(cur); cur = []; field = ''; }
        else if (c === '\r'){ }
        else field += c;
      }
    }
    if (field !== '' || cur.length){ cur.push(field); rows.push(cur); }
    return rows.filter(r => r.some(c => c.trim() !== ''));
  }

  function toPercent(v){
    if (!v) return null;
    const s = String(v).trim().replace('%','').replace(',','.');
    const n = parseFloat(s);
    if (isNaN(n)) return null;
    return n <= 1 ? n * 100 : n;
  }

  function level(n){
    if (n == null) return 'unknown';
    if (n >= 75) return 'high';
    if (n >= 50) return 'mid';
    return 'low';
  }

  function fmtPct(v){
    if (v == null) return '—';
    return v.toFixed(1).replace('.',',') + ' %';
  }

  function formaterSynthese(texteMarkdown){
    if (!texteMarkdown) return '';
    if (typeof marked === 'undefined') return esc(texteMarkdown);
    try {
      return marked.parse(texteMarkdown, { breaks: false, gfm: true });
    } catch (e) {
      console.error("Erreur rendu markdown:", e);
      return esc(texteMarkdown);
    }
  }

  function extraireDate(brut){
    if (!brut) return 'date inconnue';
    const s = String(brut).trim();

    let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (m) return m[1].padStart(2,'0') + '/' + m[2].padStart(2,'0') + '/' + m[3];

    m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if (m) return m[3].padStart(2,'0') + '/' + m[2].padStart(2,'0') + '/' + m[1];

    try {
      const d = new Date(s);
      if (!isNaN(d)){
        return String(d.getDate()).padStart(2,'0') + '/' +
               String(d.getMonth()+1).padStart(2,'0') + '/' +
               d.getFullYear();
      }
    } catch(e){}
    return s;
  }

  async function chargerTout(){
    const params = new URLSearchParams(location.search);
    const formation = params.get('formation');

    if (!formation){
      showError("Aucune formation spécifiée", "Le lien est incomplet. Veuillez retourner au tableau de bord.");
      return;
    }

    try {
      const [resFormations, resSuggestions, resRefus, resSynth] = await Promise.all([
        fetch(CSV_RESULTATS + '?t=' + Date.now(), { cache: 'no-store' }),
        fetch(CSV_SUGGESTIONS + '?t=' + Date.now(), { cache: 'no-store' }),
        fetch(CSV_REFUS + '?t=' + Date.now(), { cache: 'no-store' }),
        fetch(CSV_SYNTHESE + '?t=' + Date.now(), { cache: 'no-store' })
      ]);

      const rowsF = parseCSV(await resFormations.text());
      const rowsS = parseCSV(await resSuggestions.text());
      const rowsR = parseCSV(await resRefus.text());
      const rowsSyn = parseCSV(await resSynth.text());

      rowsS.slice(1).forEach(r => {
        const dateBrute = (r[0] || '').trim();
        const f = (r[1] || '').trim();
        const s = (r[2] || '').trim();
        if (!f || !s) return;
        if (!SUGGESTIONS[f]) SUGGESTIONS[f] = [];
        SUGGESTIONS[f].push({
          date: extraireDate(dateBrute),
          texte: s
        });
      });

      rowsSyn.slice(1).forEach(r => {
        const f = (r[0] || '').trim();
        if (!f) return;
        SYNTHESES[f] = {
          nb: parseInt(r[1], 10) || 0,
          texte: (r[2] || '').trim()
        };
      });

      let refusInfo = { refus: null, taux: null };
      rowsR.slice(1).forEach(r => {
        if ((r[0] || '').trim() === formation){
          refusInfo = {
            refus: parseInt(r[1], 10) || 0,
            taux: toPercent(r[3])
          };
        }
      });

      const row = rowsF.slice(1).find(r => (r[0] || '').trim() === formation);
      if (!row){
        showError("Formation introuvable", "La formation « " + formation + " » n'existe pas dans les données.");
        return;
      }

      const allHeaders = rowsF[0].map(h => h.trim());
      let cutoff = allHeaders.length;
      for (let i = 1; i < allHeaders.length; i++){
        if (allHeaders[i] === ''){ cutoff = i; break; }
      }
      const headers = allHeaders.slice(0, cutoff);

      const iReponses = headers.findIndex(h => /^Réponses?$/i.test(h));
      const iRep = headers.findIndex(h => /réponse aux attentes/i.test(h));
      const iObj = headers.findIndex(h => /atteinte des objectifs/i.test(h));
      const iUti = headers.findIndex(h => /utilisation compétences/i.test(h));
      const iQua = headers.findIndex(h => /qualité.*animation/i.test(h));

      const getNum = (i) => {
        if (i < 0) return null;
        const raw = (row[i] || '').trim();
        if (raw === '' || raw === '—') return null;
        return toPercent(raw);
      };

      const reponses = iReponses >= 0 ? (parseInt(row[iReponses], 10) || null) : null;
      const pRep = getNum(iRep);
      const pObj = getNum(iObj);
      const pUti = getNum(iUti);
      const pQua = getNum(iQua);

      const vals = [pRep, pObj, pUti, pQua].filter(v => v != null);
      const satisfaction = vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : null;

      DONNEES_FORMATION = {
        name: formation,
        satisfaction, reponses,
        pRep, pObj, pUti, pQua,
        refus: refusInfo.refus,
        tauxRefus: refusInfo.taux,
        suggestions: SUGGESTIONS[formation] || [],
        synthese: SYNTHESES[formation] || null
      };

      render(DONNEES_FORMATION);

    } catch (e) {
      console.error("Erreur chargement:", e);
      showError("Erreur de chargement", e.message);
    }
  }

  function render(r){
    const lvl = level(r.satisfaction);
    const pct = r.satisfaction != null ? Math.max(0, Math.min(100, r.satisfaction)) : 0;

    const indCard = (label, value) => {
      const l = level(value);
      const cls = value == null ? 'empty' : l;
      return '<div class="ind-card '+l+'">' +
        '<div class="ind-label">'+esc(label)+'</div>' +
        '<div class="ind-value '+cls+'">'+fmtPct(value)+'</div>' +
      '</div>';
    };

    /* ---------- Bloc Suggestions & remarques ---------- */
    let suggBlock = '';

    if (r.suggestions.length || (r.synthese && r.synthese.texte)){
      const nbRemarques = r.suggestions.length;

      // En-tête : titre + bouton télécharger (le bouton n'apparaît que s'il y a des suggestions)
      const headerBtn = nbRemarques
        ? '<button class="btn-download" onclick="telechargerVerbatim()" type="button">' +
            '<svg viewBox="0 0 24 24">' +
              '<path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>' +
            '</svg>' +
            'Télécharger le verbatim des suggestions et remarques' +
          '</button>'
        : '';

      const headerCount = nbRemarques
        ? '<span class="count">' + nbRemarques + '</span>'
        : '';

      // Sous-section Synthèse IA
      let synthSub = '';
      if (r.synthese && r.synthese.texte){
        synthSub =
          '<div class="sub-section">' +
            '<h3 class="sub-title">🤖 Synthèse IA ' +
              '<span class="badge">' + r.synthese.nb + ' remarque' + (r.synthese.nb > 1 ? 's' : '') + '</span>' +
            '</h3>' +
            '<div class="synth-content">' + formaterSynthese(r.synthese.texte) + '</div>' +
          '</div>';
      } else {
        synthSub =
          '<div class="sub-section">' +
            '<h3 class="sub-title">🤖 Synthèse IA</h3>' +
            '<div class="synth-none">Aucune synthèse générée pour cette formation.</div>' +
          '</div>';
      }

      suggBlock =
        '<div class="sugg-bloc">' +
          '<div class="sugg-header">' +
            '<h2 class="sugg-title">💬 Suggestions & remarques ' + headerCount + '</h2>' +
            headerBtn +
          '</div>' +
          synthSub +
        '</div>';
    } else {
      suggBlock =
        '<div class="sugg-bloc">' +
          '<div class="sugg-header">' +
            '<h2 class="sugg-title">💬 Suggestions & remarques</h2>' +
          '</div>' +
          '<div class="synth-none">Aucune remarque ni synthèse pour cette formation.</div>' +
        '</div>';
    }

    const metaParts = [];
    if (r.reponses != null) metaParts.push('<strong>'+r.reponses+'</strong> réponse'+(r.reponses > 1 ? 's' : ''));
    if (r.refus != null && r.refus > 0) metaParts.push('<strong>'+r.refus+'</strong> refus');
    if (r.tauxRefus != null) metaParts.push('Taux de refus : <strong>'+fmtPct(r.tauxRefus)+'</strong>');
    const meta = metaParts.length ? metaParts.join(' • ') : '';

    document.getElementById('content').innerHTML =
      '<div class="page">' +

        '<div class="titre-bloc '+lvl+'">' +
          '<div class="eyebrow">Formation</div>' +
          '<h1>'+esc(r.name)+'</h1>' +
        '</div>' +

        '<div class="taux-bloc '+lvl+'">' +
          '<div class="label">Taux de satisfaction global</div>' +
          '<div class="value">'+fmtPct(r.satisfaction)+'</div>' +
          '<div class="bar"><span style="width:'+pct+'%"></span></div>' +
          (meta ? '<div class="meta">'+meta+'</div>' : '') +
        '</div>' +

        '<div class="indicators-grid">' +
          indCard('Réponse aux attentes', r.pRep) +
          indCard('Atteinte des objectifs', r.pObj) +
          indCard('Utilisation compétences', r.pUti) +
          indCard('Qualité animation', r.pQua) +
        '</div>' +

        suggBlock +

      '</div>';

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.title = r.name + ' — Évaluation complète';
  }

  /* ============================================================
     TÉLÉCHARGEMENT DU VERBATIM (.txt) GROUPÉ PAR DATE
     ============================================================ */
  function telechargerVerbatim(){
    if (!DONNEES_FORMATION){
      alert("Les données ne sont pas encore chargées.");
      return;
    }
    const r = DONNEES_FORMATION;
    const maintenant = new Date();
    const dateStr = maintenant.toLocaleString('fr-FR', {
      day:'2-digit', month:'long', year:'numeric',
      hour:'2-digit', minute:'2-digit'
    });

    // Regrouper les suggestions par date
    const parDate = {};
    r.suggestions.forEach(s => {
      const d = s.date || 'date inconnue';
      if (!parDate[d]) parDate[d] = [];
      parDate[d].push(s.texte);
    });

    // Trier les dates : les plus récentes d'abord
    const datesTriees = Object.keys(parDate).sort((a, b) => {
      const da = parseDateFr(a);
      const db = parseDateFr(b);
      if (da && db) return db - da;  // décroissant
      return b.localeCompare(a);     // fallback alphabétique
    });

    let contenu = '';
    contenu += '================================================================\n';
    contenu += 'VERBATIM DES SUGGESTIONS ET REMARQUES\n';
    contenu += '================================================================\n\n';
    contenu += 'Formation    : ' + r.name + '\n';
    contenu += 'Remarques    : ' + r.suggestions.length + '\n';
    if (r.reponses != null) contenu += 'Réponses     : ' + r.reponses + '\n';
    if (r.satisfaction != null) contenu += 'Satisfaction : ' + fmtPct(r.satisfaction) + '\n';
    contenu += 'Sessions     : ' + datesTriees.length + '\n';
    contenu += 'Exporté le   : ' + dateStr + '\n';
    contenu += '\n';

    datesTriees.forEach(date => {
      const items = parDate[date];
      contenu += '================================================================\n';
      contenu += 'SESSION DU ' + date + '  (' + items.length + ' remarque' + (items.length > 1 ? 's' : '') + ')\n';
      contenu += '================================================================\n\n';
      items.forEach((txt, i) => {
        contenu += '  ' + (i + 1) + '. ' + txt + '\n\n';
      });
    });

    contenu += '================================================================\n';
    contenu += 'Lycée Professionnel Maritime Boulogne - Le Portel\n';
    contenu += 'Conception et réalisation : ZEG\n';
    contenu += '================================================================\n';

    const blob = new Blob([contenu], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const nomFichier = 'Verbatim_' +
      r.name.replace(/[^a-zA-Z0-9]/g, '_') + '_' +
      maintenant.toISOString().slice(0, 10) + '.txt';
    a.href = url;
    a.download = nomFichier;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    console.log("Verbatim téléchargé : " + nomFichier);
  }

  function parseDateFr(str){
    const m = String(str).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!m) return null;
    return new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
  }

  function showError(title, msg){
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').innerHTML =
      '<div class="error-box"><h3>'+esc(title)+'</h3><p>'+esc(msg)+'</p></div>';
    document.getElementById('content').style.display = 'block';
  }

  chargerTout();
</script>
